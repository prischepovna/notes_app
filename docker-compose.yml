services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
      POSTGRES_DB: notes_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: notes_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://notes_user:notes_password@db:5432/notes_db
    ports:
      - "8000:8000"

volumes:
  pgdata:
